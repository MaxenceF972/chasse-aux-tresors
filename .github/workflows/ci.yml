name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Aligné sur l'environnement de dev (npm 11 a écrit le lockfile :
          # npm 10 de Node 20 ne le consomme plus, et GitHub déprécie Node 20)
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: |
          npm ci --no-audit --no-fund 2>&1 | tee install.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            # Publie le DÉBUT de l'erreur en annotation (diagnostic lisible sans auth)
            echo "::error title=npm-ci-code::$(grep -m1 'npm error code' install.log || echo 'code introuvable')"
            echo "::error title=npm-ci-debut::$(grep 'npm error' install.log | head -10 | tr '\n' ' ' | cut -c1-900)"
            echo "::error title=env::node=$(node -v) npm=$(npm -v) lock=$(test -f package-lock.json && echo present || echo ABSENT)"
            exit 1
          fi

      - name: Tests unitaires (algos critiques)
        run: npm test

      - name: Build Next.js
        run: npm run build
        env:
          # Valeurs factices : le build n'appelle jamais Supabase,
          # les vraies clés vivent dans Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-key
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ci-dummy-vapid
